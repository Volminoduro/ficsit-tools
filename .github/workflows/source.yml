# Chaque semaine : la source des données (greeny/SatisfactoryTools) a-t-elle changé depuis la
# dernière régénération du référentiel ? Échec = mise à jour du jeu à intégrer (donnees.py, puis
# payloads.py et les combinaisons). Ne bloque aucune PR.
name: Source des données
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Référentiel régénéré depuis la source
        run: |
          python3 scripts/donnees.py --sans-icones
          if ! git diff --quiet -I '"recupere_le"' -- donnees/; then
            git diff --stat -I '"recupere_le"' -- donnees/
            echo "::error::La source a changé : relancer scripts/donnees.py, puis payloads.py et les combinaisons (voir README)."
            exit 1
          fi
