# Vérifications de chaque PR : les pages publiées correspondent à leurs sources et s'affichent sans
# erreur. Versions épinglées : un autre Pillow pourrait ré-encoder les icônes différemment.
name: Vérifications
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pillow==12.3.0
      - name: Pages régénérées depuis commun/, changelog.json et donnees/
        run: |
          python3 scripts/langue.py
          python3 scripts/patchnotes.py
          python3 scripts/payloads.py
          if ! git diff --quiet; then
            git diff --stat
            echo "::error::Pages pas à jour : relancer langue.py, patchnotes.py et payloads.py, puis committer (voir README)."
            exit 1
          fi
      - name: Payloads alignés sur le référentiel
        run: python3 scripts/verif_payloads.py
      - name: Pages dans un navigateur (erreurs JS, texte de l'autre langue)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test_pages.js
