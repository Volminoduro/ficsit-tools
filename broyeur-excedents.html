body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px 84px}
.stripe{height:7px;background:repeating-linear-gradient(-45deg,var(--or) 0 12px,#171a1d 12px 24px);opacity:.85}
header{padding:34px 0 22px;margin-bottom:8px;border-bottom:1px solid var(--ln)}
.eyebrow{font-family:var(--disp);font-weight:500;font-size:11px;letter-spacing:.22em;color:var(--or);text-transform:uppercase;margin:0 0 10px}
h1{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 12px;line-height:1.25}
h1 em{font-style:normal;color:var(--or)}
.lede{color:var(--ink2);max-width:64ch;margin:0;font-size:14.5px}
h2{display:flex;align-items:center;gap:14px;font-family:var(--disp);font-weight:500;font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--or);margin:36px 0 6px}
h2::after{content:"";flex:1;height:1px;background:var(--ln)}
.hint{color:var(--ink3);font-size:13px;margin:0 0 14px;max-width:72ch}
.panel{background:var(--p1);border:1px solid var(--ln);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);padding:16px}
input,select,button{font:inherit;color:var(--ink)}
input[type=text],input[type=number],select{background:var(--p3);border:1px solid var(--ln2);border-radius:0;
  padding:9px 11px;outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
input:focus,select:focus{border-color:var(--or)}
select{cursor:pointer}
.combo{position:relative}
#pick{width:100%}
.drop{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:300px;overflow:auto;
  background:var(--p1);border:1px solid var(--ln2);padding:4px;box-shadow:0 10px 26px rgba(0,0,0,.55)}
.drop div{padding:4px 7px;cursor:pointer;display:flex;align-items:center;gap:10px;border-left:2px solid transparent}
.drop div:hover{background:#2b323a;border-left-color:var(--or)}
.drop div .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.drop small{color:var(--ink3);font-family:var(--disp);font-weight:500;font-size:10.5px;letter-spacing:.06em;white-space:nowrap}
.slot{display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--p3);
  border:1px solid var(--ln2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);width:36px;height:36px}
.slot img{width:80%;height:80%;object-fit:contain;display:block}
.slot.sm{width:20px;height:20px;border-width:1px;vertical-align:-5px;margin-right:5px}
.slot.md{width:28px;height:28px}
.slot.xl{width:46px;height:46px}
.rows{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:11px;background:var(--p2);border:1px solid var(--ln);padding:7px 8px 7px 7px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.row .nm b{font-weight:500}
.row .nm span{color:var(--ink3);font-size:12px;margin-left:8px}
.row .num{display:flex;align-items:stretch}
.row input{width:80px;text-align:right;font-family:var(--disp);font-weight:500;font-size:13px;padding:7px 9px;border-right:none}
.row input::-webkit-outer-spin-button,.row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row input[type=number]{-moz-appearance:textfield;appearance:textfield}
.spin{display:flex;flex-direction:column;border:1px solid var(--ln2)}
.spin button{background:var(--p2);border:none;color:var(--ink3);cursor:pointer;width:19px;height:50%;padding:0;
  font-size:7px;line-height:1;display:flex;align-items:center;justify-content:center}
.spin button:first-child{border-bottom:1px solid var(--ln2)}
.spin button:hover{background:var(--or);color:var(--or-ink)}
.row .un{color:var(--ink3);font-size:11px;font-family:var(--disp);letter-spacing:.08em}
.x{background:none;border:1px solid transparent;color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;padding:5px 8px}
.x:hover{color:var(--or);border-color:var(--ln2);background:var(--p3)}
.empty{color:var(--ink3);font-size:14px;padding:12px 2px}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:18px 0 14px;font-size:12.5px;color:var(--ink2)}
.bar>span:first-child{font-family:var(--disp);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.bar label{display:flex;align-items:center;gap:7px;cursor:pointer}
.bar select{padding:6px 8px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--ln2)}
.seg button{background:var(--p2);border:none;border-right:1px solid var(--ln2);padding:7px 13px;cursor:pointer;
  font-family:var(--disp);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.seg button:last-child{border-right:none}
.resetbtn{background:transparent;border:1px solid var(--ln2);color:var(--ink);opacity:.65;font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.resetbtn:hover{opacity:1;border-color:var(--or,#FA9549);color:var(--or,#FA9549)}
.seg button:hover{color:var(--ink);background:#2b323a}
.seg button[aria-pressed=true]{background:var(--or);color:var(--or-ink)}
.base{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--p1);border:1px solid var(--ln);
  border-left:4px solid var(--ln2);padding:12px 16px;margin-bottom:14px}
.base b{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.02em}
.base span{color:var(--ink2);font-size:13px}
.card{background:var(--p1);border:1px solid var(--ln);border-left:4px solid var(--ln);margin-bottom:6px}
.card:hover{border-color:var(--ln2);border-left-color:var(--ln2)}
.card.best{border-left-color:var(--or)}
.card.open{border-left-color:var(--or-d)}
.chead{display:flex;align-items:center;gap:13px;padding:11px 14px;cursor:pointer}
.rank{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--ink3);width:22px;flex:none}
.ttl{flex:1;min-width:0}
.ttl b{font-weight:500;font-size:15px}
.ttl small{display:block;color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier{font-family:var(--disp);font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--or);
  border:1px solid var(--or-d);padding:2px 6px;flex:none}
.big{font-family:var(--disp);font-weight:500;font-size:17px;text-align:right;flex:none;min-width:120px;letter-spacing:.01em}
.big i{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  font-weight:500;margin-top:2px}
.body{display:none;border-top:1px solid var(--ln);padding:14px}
.card.open .body{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:6px;margin-bottom:12px}
.m{background:var(--p2);border:1px solid var(--ln);padding:9px 11px}
.m i{display:block;font-style:normal;color:var(--ink3);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.m b{font-family:var(--disp);font-weight:500;font-size:15px}
.body p{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.body p:last-child{margin:0}
.tag{font-size:12.5px;background:var(--p2);border:1px solid var(--ln);padding:3px 8px 3px 4px;
  margin:0 4px 4px 0;display:inline-flex;align-items:center;color:var(--ink2)}
.tag.bind{color:var(--or);border-color:var(--or-d)}
.cov{height:5px;background:var(--p3);border:1px solid var(--ln);margin-top:6px}
.cov b{display:block;height:100%;background:var(--or)}
footer{margin-top:46px;border-top:1px solid var(--ln);padding-top:18px;color:var(--ink3);font-size:12.5px;max-width:76ch}
footer p{margin:0 0 8px}
@media (max-width:620px){.big{min-width:96px;font-size:15px}.wrap{padding:0 14px 60px}.slot.xl{width:36px;height:36px}}

<script>
const P=JSON.parse(document.getElementById('payload').textContent);
const SRC=P.src, TGT=P.tgt;
const IC=JSON.parse(document.getElementById('icons').textContent);
const ico=(n,c)=>`<span class="slot ${c||''}">${IC[n]?`<img alt="" loading="lazy" src="data:image/webp;base64,${IC[n]}">`:''}</span>`;
const sel=new Map();
let lang='fr';

/* ---------- mémoire des réglages (localStorage, par navigateur) ---------- */
const PREFS_KEY='ficsit-tools:broyeur:v1';
const PREFS=(()=>{ try{ return JSON.parse(localStorage.getItem(PREFS_KEY))||{}; }catch(e){ return {}; } })();
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify({
    lang, sortMode,
    surplus:[...sel].map(([i,r])=>[SRC[i].n,r]),
    noRaw:document.getElementById('noRaw').checked,
    rawSel:document.getElementById('rawSel').value,
    tierSel:document.getElementById('tierSel').value })); }catch(e){}
}

function applyStaticLang(){
  const L = STR[lang];
  document.getElementById('eyebrow').textContent = L.eyebrow;
  document.getElementById('h1').innerHTML = L.h1;
  document.getElementById('lede').textContent = L.lede;
  document.getElementById('h2surplus').textContent = L.h2surplus;
  document.getElementById('hintSurplus').textContent = L.hintSurplus;
  document.getElementById('pick').placeholder = L.pickPlaceholder;
  document.getElementById('pick').setAttribute('aria-label', L.pickAria);
  document.getElementById('h2value').textContent = L.h2value;
  document.getElementById('sortByLbl').textContent = L.sortByLbl;
  const sb = document.querySelectorAll('#sortSeg button');
  sb[0].textContent = L.sortR; sb[1].textContent = L.sortP; sb[2].textContent = L.sortC;
  document.getElementById('noRawLbl').textContent = L.noRawLbl;
  document.getElementById('rawMaxLbl').textContent = L.rawMaxLbl;
  document.getElementById('rawOptAny').textContent = L.rawOptAny;
  document.getElementById('tierMaxLbl').textContent = L.tierMaxLbl;
  const eo = document.getElementById('emptyOut'); if(eo) eo.textContent = L.emptyOut;
  document.getElementById('foot1').textContent = L.footer[0];
  document.getElementById('foot2').textContent = L.footer[1];
  document.getElementById('foot3').textContent = L.footer[2];
  document.documentElement.lang = lang;
  const rb = document.getElementById('resetPrefs');
  rb.textContent = lang==='fr' ? 'Réinitialiser' : 'Reset';
  rb.title = lang==='fr' ? 'Oublier les réglages mémorisés et revenir aux valeurs par défaut'
                         : 'Forget saved settings and restore defaults';
  const ts2 = document.getElementById('tierSel');
  if(ts2.options.length) ts2.options[0].textContent = L.tierAll;
}

const nf=(v,d)=>{
  if(v===null||v===undefined||!isFinite(v))return '—';
  if(Math.abs(v)>=1000)return Math.round(v).toLocaleString('fr-FR');
  if(Math.abs(v)>=100)return v.toFixed(0);
  if(Math.abs(v)>=10)return v.toFixed(1);
  return v.toFixed(d===undefined?2:d);
};
let sortMode='r';

const maxT=Math.max(...TGT.map(t=>t.t));
const ts=document.getElementById('tierSel');
function buildTierSel(){
  const prev=ts.value;
  ts.innerHTML='<option value="99">'+STR[lang].tierAll+'</option>'+Array.from({length:maxT},(_,i)=>i+1)
    .map(n=>`<option value="${n}">${n}</option>`).join('');
  ts.value=[...ts.options].some(o=>o.value===prev)?prev:'99';
}
buildTierSel();

const pick=document.getElementById('pick'), drop=document.getElementById('drop');
function renderDrop(){
  const q=pick.value.trim().toLowerCase();
  const list=SRC.map((s,i)=>({s,i})).filter(o=>!sel.has(o.i)&&o.s.n.toLowerCase().includes(q)).slice(0,60);
  if(!list.length){drop.hidden=true;return;}
  drop.innerHTML=list.map(o=>`<div data-i="${o.i}">${ico(o.s.n,'md')}<span class="n">${o.s.n}</span><small>${o.s.liq?STR[lang].fluid:o.s.sp+' '+STR[lang].pts}</small></div>`).join('');
  drop.hidden=false;
}
pick.addEventListener('input',renderDrop);
pick.addEventListener('focus',renderDrop);
pick.addEventListener('click',renderDrop);
drop.addEventListener('mousedown',e=>{
  const d=e.target.closest('div[data-i]'); if(!d)return;
  e.preventDefault(); e.stopPropagation();
  add(+d.dataset.i); pick.value=''; drop.hidden=true; pick.focus();
});
document.addEventListener('mousedown',e=>{
  if(!e.target.closest('.combo'))drop.hidden=true;
});

function add(i){ sel.set(i,60); rows(); compute(); }
function rows(){
  const el=document.getElementById('rows');
  if(!sel.size){el.innerHTML='<div class="empty">'+STR[lang].emptyRows+'</div>';return;}
  el.innerHTML=[...sel].map(([i,r])=>{
    const s=SRC[i];
    return `<div class="row">${ico(s.n)}<div class="nm"><b>${s.n}</b><span>${s.liq?STR[lang].fluidZero:s.sp+' '+STR[lang].ptsEach}</span></div>
      <span class="num"><input type="number" min="0" step="1" value="${r}" data-i="${i}" aria-label="${STR[lang].rateOf(s.n)}"><span class="spin"><button data-up="${i}" tabindex="-1" aria-label="+">&#9650;</button><button data-dn="${i}" tabindex="-1" aria-label="-">&#9660;</button></span></span>
      <span class="un">/min</span>
      <button class="x" data-del="${i}" aria-label="${STR[lang].removeOf(s.n)}">&times;</button></div>`;
  }).join('');
  el.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',e=>{
    sel.set(+e.target.dataset.i, Math.max(0,+e.target.value||0)); compute();
  }));
  el.querySelectorAll('[data-up],[data-dn]').forEach(b=>b.addEventListener('click',e=>{
    const t=e.currentTarget, up=t.dataset.up!==undefined;
    const i=+(up?t.dataset.up:t.dataset.dn), st=e.shiftKey?10:1;
    const v=Math.max(0,(sel.get(i)||0)+(up?st:-st));
    sel.set(i,v);
    const inp=el.querySelector('input[data-i="'+i+'"]'); if(inp)inp.value=v;
    compute();
  }));
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',e=>{
    sel.delete(+e.currentTarget.dataset.del); rows(); compute();
  }));
}

document.getElementById('sortSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  sortMode=b.dataset.s;
  document.querySelectorAll('#sortSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  compute();
});
document.getElementById('noRaw').addEventListener('change',compute);
document.getElementById('rawSel').addEventListener('change',compute);
ts.addEventListener('change',compute);

function compute(){
  savePrefs();
  const out=document.getElementById('out');
  if(!sel.size){out.innerHTML='<div class="empty">'+STR[lang].emptyOut+'</div>';return;}
  let baseline=0;
  for(const [i,r] of sel) baseline+=SRC[i].sp*r;

  const noRaw=document.getElementById('noRaw').checked, tmax=+ts.value;
  const rawCap=+document.getElementById('rawSel').value;
  let totIn=0; for(const [,r] of sel) totIn+=r;
  const res=[];
  for(const t of TGT){
    if(t.t>tmax)continue;
    const used=[];
    for(const [i,r] of sel){ const u=t.u[i]; if(u&&r>0) used.push({i,u,r}); }
    if(!used.length)continue;
    let rate=Infinity, bind=null;
    for(const x of used){ const c=x.r/x.u; if(c<rate){rate=c;bind=x.i;} }
    if(!(rate>0&&isFinite(rate)))continue;
    let mwSaved=0, machSaved=0, rawSaved=0, ptsSaved=0;
    for(const x of used){
      const s=SRC[x.i];
      mwSaved+=x.u*s.mw; machSaved+=x.u*s.mach;
      rawSaved+=x.u*(s.raw==null?0:s.raw); ptsSaved+=x.u*s.sp;
    }
    const mw=rate*Math.max(0,t.mw-mwSaved);
    const raw=rate*Math.max(0,(t.raw==null?0:t.raw)-rawSaved);
    const mach=rate*Math.max(0,t.mach-machSaved);
    const pts=rate*t.sp, gain=rate*(t.sp-ptsSaved);
    if(gain<=0)continue;
    if(noRaw&&raw>0.001)continue;
    if(rawCap&&raw>rawCap*totIn)continue;
    res.push({t,rate,mw,raw,mach,pts,gain,bind,used,ratio:mw>0?gain/mw:Infinity,
      cov:t.mw>0?Math.min(1,mwSaved/t.mw):0});
  }
  if(!res.length){out.innerHTML='<div class="empty">'+STR[lang].noResults+'</div>';return;}
  res.sort((a,b)=> sortMode==='r' ? b.ratio-a.ratio : sortMode==='p' ? b.pts-a.pts : b.cov-a.cov);
  const top=res.slice(0,14);

  out.innerHTML=`<div class="base"><b>${nf(baseline)}</b><span>${STR[lang].baseLabel}</span></div>`
   + top.map((o,k)=>{
    const t=o.t;
    const tags=o.used.map(x=>`<span class="tag${x.i===o.bind?' bind':''}">${ico(SRC[x.i].n,'sm')}${SRC[x.i].n} · ${nf(x.u*o.rate)}/min${x.i===o.bind?' · '+STR[lang].limiting:''}</span>`).join('');
    const left=o.used.filter(x=>x.i!==o.bind).map(x=>{
      const rest=x.r-x.u*o.rate;
      return rest>0.01?`<span class="tag">${ico(SRC[x.i].n,'sm')}${SRC[x.i].n} · ${nf(rest)}/min ${STR[lang].leftover}</span>`:'';
    }).join('');
    return `<div class="card${k===0?' best':''}">
      <div class="chead" data-k="${k}">
        <span class="rank">${k+1}</span>
        ${ico(t.n,'xl')}
        <span class="ttl"><b>${t.n}</b><small>${t.rec} · ${nf(o.rate)} /min · ${nf(o.mach,1)} machines · ${Math.round(o.cov*100)} % ${STR[lang].alreadyCovered}</small></span>
        <span class="tier">T${t.t}</span>
        <span class="big">${sortMode==='c'?Math.round(o.cov*100)+' %':nf(sortMode==='r'?o.ratio:o.pts)}<i>${sortMode==='r'?STR[lang].ptsPerMinPerMw:sortMode==='p'?STR[lang].ptsPerMin:STR[lang].chainCovered}</i></span>
      </div>
      <div class="body">
        <div class="grid">
          <div class="m"><i>${STR[lang].mPtsMin}</i><b>${nf(o.pts)}</b></div>
          <div class="m"><i>${STR[lang].mNetGain}</i><b>+${nf(o.gain)}</b></div>
          <div class="m"><i>${STR[lang].mMwAdd}</i><b>${nf(o.mw)} MW</b></div>
          <div class="m"><i>${STR[lang].mRatio}</i><b>${nf(o.ratio)} pts/MW</b></div>
          <div class="m"><i>${STR[lang].mRawNeeded}</i><b>${nf(o.raw)} /min</b></div>
          <div class="m"><i>${STR[lang].mChainCovered}</i><b>${Math.round(o.cov*100)} %</b><div class="cov"><b style="width:${Math.round(o.cov*100)}%"></b></div></div>
        </div>
        <p>${STR[lang].consumes} ${tags}</p>
        ${left?`<p>${STR[lang].youHaveLeft} ${left}</p>`:''}
      </div></div>`;
  }).join('');
  out.querySelectorAll('.chead').forEach(h=>h.addEventListener('click',()=>h.parentNode.classList.toggle('open')));
}
document.getElementById('langtoggle').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  lang=b.dataset.v;
  document.querySelectorAll('#langtoggle button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  applyStaticLang(); buildTierSel(); rows(); compute();
});
document.getElementById('resetPrefs').addEventListener('click',()=>{
  try{ localStorage.removeItem(PREFS_KEY); }catch(e){} location.reload();
});

/* restauration des réglages mémorisés */
{
  if(PREFS.lang==='fr'||PREFS.lang==='en') lang=PREFS.lang;
  document.querySelectorAll('#langtoggle button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===lang));
  if(['r','p','c'].includes(PREFS.sortMode)) sortMode=PREFS.sortMode;
  document.querySelectorAll('#sortSeg button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.s===sortMode));
  if(typeof PREFS.noRaw==='boolean') document.getElementById('noRaw').checked=PREFS.noRaw;
  const rs=document.getElementById('rawSel');
  if([...rs.options].some(o=>o.value===PREFS.rawSel)) rs.value=PREFS.rawSel;
  if([...ts.options].some(o=>o.value===PREFS.tierSel)) ts.value=PREFS.tierSel;
  if(Array.isArray(PREFS.surplus)) for(const [n,r] of PREFS.surplus){
    const i=SRC.findIndex(x=>x.n===n);
    if(i>=0) sel.set(i, Math.max(0,+r||0));
  }
}
applyStaticLang();
rows(); compute();
</script>
</html>
