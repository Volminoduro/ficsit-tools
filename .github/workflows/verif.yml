# Vérifications de chaque PR : les pages publiées correspondent à leurs sources et s'affichent sans
# erreur. Versions épinglées : un autre Pillow pourrait ré-encoder les icônes différemment.
name: Vérifications
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: |
          npm ci
          npx playwright install --with-deps chromium
      # Régénération (échec si une page n'est pas à jour), payloads alignés sur le référentiel,
      # pages dans un navigateur (erreurs JS, texte de l'autre langue, résultats attendus), captures de référence.
      - run: bash scripts/tout.sh --ci
      # captures de référence différentes : nouvelles captures et images des écarts à télécharger
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecarts
          path: scripts/captures-ecarts/
          if-no-files-found: ignore
